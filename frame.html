<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Frame capture</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #root { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="reel-a.jsx"></script>
<script type="text/babel" src="reel-b.jsx"></script>
<script type="text/babel" src="reel-c.jsx"></script>
<script type="text/babel" src="reel-d.jsx"></script>
<script type="text/babel" src="reel-e.jsx"></script>
<script type="text/babel" src="reel-f.jsx"></script>

<script type="text/babel">
const REELS = { A: ReelA, B: ReelB, C: ReelC, D: ReelD, E: ReelE, F: ReelF };

function FrameView() {
  // Defaults
  const [state, setState] = React.useState({ variant: 'A', t: 0 });

  // Expose imperative API for save_screenshot
  React.useEffect(() => {
    window.showFrame = (variant, t) => setState({ variant, t });
    // also signal that we are ready
    window.__frameReady = true;
  }, []);

  const Reel = REELS[state.variant] || ReelA;
  return (
    <Reel autoplay={false} forceTime={state.t} hideChrome={true}/>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FrameView />);
</script>
</body>
</html>
